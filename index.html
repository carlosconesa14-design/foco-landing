<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0e1a2b" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Rider Millionaire: Idle Tycoon</title>
    <link rel="preload" href="/fonts/lilita-one-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/rubik-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body class="loading">
    <div id="loading-screen" role="status" aria-live="polite">
      <img class="loading-app-icon" src="brand/app-icon-512.png" alt="" width="112" height="112" />
      <img class="loading-logo" src="brand/logo-dark.svg" alt="Rider Millionaire: Idle Tycoon" width="328" height="104" />
      <p>Pequeños comienzos. Grandes negocios.</p>
      <div class="loading-route" aria-hidden="true"><svg viewBox="0 0 300 70"><path d="M10 55H260Q285 55 285 35T260 15H40"/></svg><img src="sprites/veh_bike_0.webp" alt="" width="54" height="60"></div>
      <div class="loading-track" aria-hidden="true"><i></i></div>
      <small>Preparando tu ciudad…</small>
    </div>
    <div id="stage"></div>
    <div class="app" id="app">
      <header id="hud">
        <div class="wallet">
          <div class="cash" id="cash"></div>
          <button class="gems" id="gems" aria-label="Tienda de diamantes y ventajas"></button>
          <div class="rate" id="rate"></div>
          <button id="hustleShortcut" class="hustle-shortcut" aria-label="Modo hustle y opciones">x2</button>
        </div>

      </header>
      <button class="goal" id="goal" hidden aria-label="Próximo objetivo"><span class="gicon" id="goalIcon"></span><span class="gtext"><small>Objetivo</small><span id="goalText"></span></span><span class="gbar"><i id="goalBar"></i></span></button>
      <div class="tut" id="tut" hidden><span class="tut-step" id="tutStep"></span><span id="tutText"></span></div>
      <div class="rail" id="rail">
        <button data-open="missions" aria-label="Misiones"><span class="ic" data-icon="ic_missions">📋</span>Misiones<i class="dot" hidden></i></button>
        <button data-open="season" id="seasonBtn" class="season-btn" hidden aria-label="Halloween"><span class="ic">🎃</span>Halloween<i class="dot" hidden></i></button>
        <button data-open="life" aria-label="Mi vida"><span class="ic" data-icon="ic_life">🛍️</span>Mi vida<i class="dot" hidden></i></button>
        <button data-open="event" id="eventBtn" class="event-btn" hidden aria-label="Evento del fin de semana"><span class="ic">🎉</span>Evento<i class="dot" hidden></i></button>
        <button id="menuToggle" aria-label="Menú y recompensas" aria-haspopup="dialog" aria-controls="moreMenu" aria-expanded="false"><span class="ic" data-icon="ic_menu"></span>Menú<i class="dot" id="menuDot" hidden></i></button>
      </div>
      <dialog id="moreMenu" class="more-menu" aria-labelledby="menuTitle">
        <div class="menu-heading"><div><small>HAZ CRECER TU IMPERIO</small><h2 id="menuTitle">Tu negocio</h2></div><button id="menuClose" aria-label="Cerrar menú">✕</button></div>
        <div class="life" id="life"></div>
        <p class="menu-life" id="lifeDetail"></p>
        <p class="menu-life next-unlock" id="nextUnlock" hidden></p>
        <div class="boost" id="boost">
          <div class="x2">x2</div><div class="txt" id="boostTxt"></div>
          <button class="ad-btn" id="boostBtn"><span class="play"></span>+4 h</button>
        </div>
        <p class="menu-life ad-ladder" id="adLadder"></p>
        <div class="menu-grid">
          <button data-open="daily"><span class="ic">🎁</span><b>Premio diario</b><small>Tu recompensa de hoy</small><i class="dot" hidden></i></button>
          <button data-open="wheel"><span class="ic" data-icon="ic_wheel">🎡</span><b>Ruleta diaria</b><small>Un giro gratis cada día</small><i class="dot" hidden></i></button>
          <button data-open="life"><span class="ic">🛍️</span><b>Mi vida</b><small>Tu personaje y tus lujos</small><i class="dot" hidden></i></button>
          <button data-open="execs"><span class="ic">💼</span><b>Ejecutivos</b><small>Equipo y maletines</small><i class="dot" hidden></i></button>
          <button data-open="school"><span class="ic">🎓</span><b>Escuela de negocios</b><small>Investigación que no se pierde</small><i class="dot" hidden></i></button>
          <button data-open="achievements"><span class="ic">🏆</span><b>Logros</b><small>Celebra tus hitos</small><i class="dot" hidden></i></button>
          <button data-open="league"><span class="ic">🏅</span><b>Liga Millonario</b><small>Compite y reclama premios</small><i class="dot" hidden></i></button>
          <button data-open="event"><span class="ic">🎉</span><b>Evento del finde</b><small id="eventMenuSub">Premios cada fin de semana</small><i class="dot" hidden></i></button>
          <button data-open="rival"><span class="ic">🥊</span><b>Rival de la semana</b><small>Gánale antes del domingo</small></button>
          <button data-open="invite"><span class="ic">🤝</span><b>Invita a amigos</b><small>Ganáis diamantes los dos</small></button>
          <button data-open="settings"><span class="ic">⚙️</span><b>Ajustes</b><small>Sonido y vibración</small></button>
        </div>
      </dialog>
      <div class="twist" id="twist" hidden></div>
      <button class="auto-btn" id="autoBtn" hidden aria-label="Mejorar todo"><span class="ic">⚡</span><b>Mejorar todo</b><small id="autoLeft"></small></button>
      <div class="wave" id="wave" hidden><span class="txt" id="waveTxt"></span><button class="ad-btn" id="waveBtn"><span class="play"></span>Atraer ya</button></div>
      <footer id="bar"></footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
