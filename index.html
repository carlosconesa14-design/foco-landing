<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0e1a2b" />
    <title>De Rider a Millonario</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;500;700&display=swap" />
  </head>
  <body>
    <div class="app" id="app">
      <header>
        <div class="wallet">
          <div class="cash" id="cash"></div>
          <div class="rate" id="rate"></div>
        </div>
        <div class="life" id="life"></div>
        <div class="boost" id="boost">
          <div class="x2">x2</div>
          <div class="txt" id="boostTxt"></div>
          <button class="ad-btn" id="boostBtn"><span class="play"></span>+4 h</button>
        </div>
      </header>
      <main id="main"></main>
      <nav role="tablist" id="tabs">
        <button role="tab" data-tab="jobs"><span class="ic">💼</span>Carrera</button>
        <button role="tab" data-tab="auto"><span class="ic">⚙️</span><span>Automatizar<span class="dot" id="autoDot" hidden></span></span></button>
        <button role="tab" data-tab="city"><span class="ic">🏙️</span><span>Ciudad<span class="dot" id="cityDot" hidden></span></span></button>
        <button role="tab" data-tab="ipo"><span class="ic">📈</span>Bolsa</button>
      </nav>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
