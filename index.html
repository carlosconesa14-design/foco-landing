<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0e1a2b" />
    <title>De Rider a Millonario</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;500;700&display=swap" />
  </head>
  <body>
    <div id="stage"></div>
    <div class="app" id="app">
      <header id="hud">
        <div class="wallet">
          <div class="cash" id="cash"></div>
          <button class="gems" id="gems" aria-label="Diamantes y maletines"></button>
          <div class="rate" id="rate"></div>
        </div>
        <div class="row2">
        <div class="life" id="life"></div>
        <div class="boost" id="boost">
          <div class="x2">x2</div>
          <div class="txt" id="boostTxt"></div>
          <button class="ad-btn" id="boostBtn"><span class="play"></span>+4 h</button>
        </div>
        </div>
      </header>
      <button class="goal" id="goal" hidden aria-label="Próximo objetivo"><span class="gicon" id="goalIcon"></span><span class="gtext"><small>Objetivo</small><span id="goalText"></span></span><span class="gbar"><i id="goalBar"></i></span></button>
      <div class="tut" id="tut" hidden><span class="tut-step" id="tutStep"></span><span id="tutText"></span></div>
      <div class="rail" id="rail">
        <button class="rail-toggle" id="railToggle" aria-label="Mostrar u ocultar menú" aria-expanded="true"><span class="ic">◂</span><i class="tdot" hidden></i></button>
        <button data-open="missions" aria-label="Misiones"><span class="ic" data-icon="ic_missions">📋</span>Misiones<i class="dot" hidden></i></button>
        <button data-open="daily" aria-label="Premio diario"><span class="ic" data-icon="ic_daily">🎁</span>Diario<i class="dot" hidden></i></button>
        <button data-open="execs" aria-label="Ejecutivos y maletines"><span class="ic" data-icon="ic_execs">💼</span>Ejecutivos<i class="dot" hidden></i></button>
        <button data-open="achievements" aria-label="Logros"><span class="ic" data-icon="ic_trophy">🏆</span>Logros<i class="dot" hidden></i></button>
        <button data-open="settings" aria-label="Ajustes"><span class="ic" data-icon="ic_settings">⚙️</span>Ajustes</button>
      </div>
      <div class="wave" id="wave" hidden><span class="txt" id="waveTxt"></span><button class="ad-btn" id="waveBtn"><span class="play"></span>Atraer ya</button></div>
      <footer id="bar"></footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
