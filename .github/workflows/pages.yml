# Web pública (GitHub Pages): portada, política de privacidad y bases de la Liga.
# Una sola vez: Settings → Pages → Source: «GitHub Actions». Se publica al subir a main.
# DEMO "true": publica también la beta jugable en /jugar/ (sin compras, ver src/platform/web.ts).
name: Web (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  DEMO: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Montar la web
        run: |
          if [ "$DEMO" = "true" ]; then
            VITE_WEB_BETA=true npm run build
            mkdir -p _site && cp -r dist _site/jugar
          else
            npm run legal
            mkdir -p _site
          fi
          cp site/index.html _site/index.html
          mkdir -p _site/legal && cp public/legal/*.html _site/legal/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
