# Compila la app de Android (APK de prueba) en cada subida.
# Descarga: pestaña «Actions» del repositorio → la última ejecución → «Artifacts» → idle-millionaire-apk.
name: Android APK

on:
  push:
    branches: [main, claude/festive-allen-vb7bc1]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencias
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build web
        run: npm run build

      - name: Copiar el juego a Android
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: idle-millionaire-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
